config_schema_version: 1
signature_type: failure

extraction:
  prompt:
    path: prompts/failure.txt
  taxonomy:
    path: taxonomies/failure_categories.yaml
  severity:
    path: taxonomies/severity.yaml
  history_turns: 8
  max_failures_per_turn: 2
  max_evidence_spans: 3
  current_turn_tokens: 12000
  history_assistant_tokens: 200
  normalization_version: 1

judge:
  model: coreweave/google/gemma-4-31B-it
  temperature: 0

embedding:
  provider: openai
  model: text-embedding-3-large
  dimensions: 1024
  output_normalization: l2
