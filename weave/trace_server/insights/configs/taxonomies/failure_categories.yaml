# Categories a failure signature may carry.
#
# `refusal` and `capability_gap` name observable behavior rather than error,
# because the judge cannot see the product's capability limits or its safety
# policy and so cannot decide what counts as improper or as a violation.
#
# Impact is carried by `severity`, not by the category name.

labels:
  - name: task_misunderstanding
    definition: >-
      misread the current request and solved the wrong problem.

  - name: context_loss
    definition: >-
      forgot or contradicted an established referent, constraint, answer, or
      instruction.

  - name: wrong_output
    definition: >-
      produced incorrect content, including factual errors, fabricated
      APIs/data/capabilities, or code that does not work.

  - name: requirement_violation
    definition: >-
      produced otherwise plausible content but dropped a stated or standing
      requirement, format, scope, language, or required piece.

  - name: tool_misuse
    definition: >-
      selected the wrong tool, sent malformed arguments, failed to use an
      available tool, or ignored/misread a tool result.

  - name: tool_failure
    definition: >-
      a well-formed tool call failed inside the tool through an error, timeout,
      or rate limit that the assistant could observe.

  - name: system_error
    definition: >-
      infrastructure outside the assistant failed, such as a crash, model
      timeout, truncated response, or raw platform error exposed to the user.

  - name: unproductive_loop
    definition: >-
      repeated calls, retries, or approaches without meaningful progress.

  - name: capability_gap
    definition: >-
      the request exceeds what the product can do, even if declined correctly.

  - name: refusal
    definition: >-
      declined, hedged, or evaded a request, whether or not the decline was
      correct.

  - name: unsafe_behavior
    definition: >-
      took a destructive or unauthorized action or disclosed sensitive
      information, including credentials, PII, or another user's data.

  - name: other
    definition: >-
      a real, observable failure that fits none of the above. Use it sparingly. A
      growing `other` cluster is a missing category, not a durable label.
