# Sentiment labels an intent signature may carry, ordered worst to best but
# deliberately not scored: averaging a numeric encoding of ordinal labels
# asserts distances this taxonomy does not define. Aggregate the distribution
# instead.

labels:
  - name: frustrated
    definition: >-
      explicit exasperation, a repetition callout, profanity, or emphatic
      insistence.

  - name: dissatisfied
    definition: >-
      reports something broken, wrong, or unwanted, without explicit heat.

  - name: neutral
    definition: >-
      task-focused with no affect. Plain corrections, approvals, and
      cancellations are neutral.

  - name: satisfied
    definition: >-
      brief thanks, warm agreement, or a short positive acknowledgement.

  - name: delighted
    definition: >-
      emphatic or unprompted praise.
