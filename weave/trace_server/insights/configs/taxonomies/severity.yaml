# Severity labels a failure signature may carry, ordered least to most impactful.
#
# `info` is the bottom rung rather than `low` because two categories, `refusal`
# and `capability_gap`, record behavior that is not necessarily wrong; a ladder
# whose floor still reads as a problem would misreport them.
#
# The ladder is deliberately bottom-weighted: `major` is meant to be the rare
# label, so a failure that sits between two rungs takes the lower one.

labels:
  - name: info
    definition: >-
      notable behavior that is not necessarily wrong. Default for `refusal` and
      `capability_gap`.

  - name: minor
    definition: >-
      degraded the turn, but the user still got what they asked for, or the
      shortfall is visible in the response and one correction away.

  - name: major
    definition: >-
      the turn was wasted or misleading: the assistant's main task for it failed
      outright, the response asserted something untrue, or the user was harmed. A
      visible shortfall the user can correct in one turn is `minor`, not `major`.
