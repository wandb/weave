# Categories an intent signature may carry.
#
# `feedback` is split on polarity because the two halves cluster separately.
#
# `correction` plus `clarification` are merged into `refinement` because the
# contradiction-versus-added-detail boundary produced label noise that a join
# against failure signatures recovers anyway.

labels:
  - name: action_request
    definition: >-
      asks the agent to do, create, change, remove, or execute something,
      including a requested capability that does not exist yet.

  - name: information_request
    definition: >-
      asks for information, explanation, instructions, comparison, or analysis.

  - name: problem_report
    definition: >-
      reports broken or incorrect behavior without requesting a remedy.

  - name: positive_feedback
    definition: >-
      praises or expresses satisfaction with behavior working as designed,
      without requesting action.

  - name: negative_feedback
    definition: >-
      complains about or expresses dissatisfaction with behavior working as
      designed, including naming a capability the product lacks, without
      requesting action.

  - name: approval
    definition: >-
      authorizes or agrees to a proposed action.

  - name: rejection
    definition: >-
      declines, cancels, stops, or aborts a proposed or in-flight action.

  - name: refinement
    definition: >-
      redirects the agent, either by contradicting its output, its understanding,
      or an earlier user request, or by supplying requested or additional detail.

  - name: bad_faith
    definition: >-
      intentional misuse of the agent, including jailbreak or prompt-injection
      attempts, attempts to extract system instructions or another user's data,
      or sandbox escape.

  - name: other
    definition: >-
      a meaningful intent that fits none of the above.
