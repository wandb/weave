name: nightly-tests

on:
  schedule:
    # Run at midnight UTC
    - cron: "0 0 * * *"
  # Allow manual triggering
  workflow_dispatch:
    inputs:
      shards:
        description: "Comma-separated list of shards to run (leave empty for all)"
        required: false
        default: ""

jobs:
  nightly-tests:
    name: Nightly Tests
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
      id-token: write
    runs-on: ubuntu-latest-8-cores
    env:
      MAX_ATTEMPTS: 3
      CORE_DIR: core
      COMPOSE_FILE: .github/compose/weave-trace-tests.yaml
      # One server per xdist worker or parallel shard.
      TRACE_SERVER_COUNT: 8
      # Longest first, so the parallel shards finish together.
      INTEGRATION_SHARDS: >-
        llamaindex langchain autogen_tests trace_server_bindings flow scorers
        crewai openai dspy anthropic verifiers_test vertexai litellm mistral
        instructor smolagents google_genai pandas_test bedrock fastmcp cohere
        cerebras groq notdiamond
    strategy:
      matrix:
        python-version-major: ["3"]
        python-version-minor: [
            "10",
            "11",
            "12",
            "13",
            #
          ]
        # Every job starts core's stack, so the shards other than trace share
        # one job per Python version and run side by side.
        group: ["trace", "integrations"]
        include:
          # verifiers_test dependencies require Python >= 3.11.
          - python-version-minor: "10"
            group: "integrations"
            skip-shards: "verifiers_test"
      fail-fast: false
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Filter shards if specified
        id: filter_shards
        env:
          INPUT_SHARDS: ${{ github.event.inputs.shards }}
          SKIP_SHARDS: ${{ matrix.skip-shards }}
        run: |
          if [[ "${{ matrix.group }}" == "trace" ]]; then
            candidates="trace"
          else
            candidates="${INTEGRATION_SHARDS}"
          fi
          shards=()
          for shard in ${candidates}; do
            [[ " ${SKIP_SHARDS} " == *" ${shard} "* ]] && continue
            [[ -n "${INPUT_SHARDS}" && ",${INPUT_SHARDS}," != *",${shard},"* ]] && continue
            shards+=("${shard}")
          done
          echo "Running shards: ${shards[*]}"
          echo "shards=${shards[*]}" >> "$GITHUB_OUTPUT"
          if [[ ${#shards[@]} == 0 ]]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Create GitHub App token
        id: app-token
        if: steps.filter_shards.outputs.skip != 'true'
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3
        with:
          app-id: ${{ vars.WANDBOT_3000_APP_ID }}
          private-key: ${{ secrets.WANDBOT_3000_PRIVATE_KEY }}
          owner: wandb
          repositories: core
          permission-contents: read
      - name: Checkout core
        if: steps.filter_shards.outputs.skip != 'true'
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: wandb/core
          ref: master
          path: ${{ env.CORE_DIR }}
          token: ${{ steps.app-token.outputs.token }}
          persist-credentials: false
      - name: Remove core Weave submodule placeholder
        if: steps.filter_shards.outputs.skip != 'true'
        run: rm -rf "${CORE_DIR}/services/weave-trace/weave-public"
      - name: Checkout current weave commit into core
        if: steps.filter_shards.outputs.skip != 'true'
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          path: ${{ env.CORE_DIR }}/services/weave-trace/weave-public
          persist-credentials: false
      - name: Authenticate to Google Cloud
        if: steps.filter_shards.outputs.skip != 'true'
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ secrets.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.WORKLOAD_IDENTITY_SERVICE_ACCOUNT }}
      - name: Set up gcloud
        if: steps.filter_shards.outputs.skip != 'true'
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3
      - name: Configure Docker auth
        if: steps.filter_shards.outputs.skip != 'true'
        run: gcloud auth configure-docker us-central1-docker.pkg.dev --quiet
      - name: Enable debug logging
        if: steps.filter_shards.outputs.skip != 'true'
        run: echo "ACTIONS_STEP_DEBUG=true" >> $GITHUB_ENV
      - name: Set up Python ${{ matrix.python-version-major }}.${{ matrix.python-version-minor }}
        if: steps.filter_shards.outputs.skip != 'true'
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version-major }}.${{ matrix.python-version-minor }}
      - name: Install dependencies
        if: steps.filter_shards.outputs.skip != 'true'
        run: |
          python -m pip install --upgrade pip
          pip install nox uv
      - name: Start trace servers
        if: steps.filter_shards.outputs.skip != 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: .github/scripts/start-trace-server.sh
      - name: Run nox (HTTP trace server)
        if: steps.filter_shards.outputs.skip != 'true'
        env:
          WEAVE_SENTRY_ENV: ci
          CI: 1
          WEAVE_USE_MEMRAY: 1
          WANDB_BASE_URL: http://localhost:8080
          WEAVE_SERVER_DISABLE_ECOSYSTEM: 1
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          DD_TRACE_ENABLED: false
          PYTHON_VERSION: ${{ matrix.python-version-major }}.${{ matrix.python-version-minor }}
        run: |
          if [[ "${{ matrix.group }}" == "integrations" ]]; then
            # verifiers_test runs every test, not only the server-backed ones.
            python .github/scripts/run_nox_shards.py "${PYTHON_VERSION}" ${{ steps.filter_shards.outputs.shards }} \
              --unfiltered verifiers_test --attempts "${MAX_ATTEMPTS}" --log-dir "${RUNNER_TEMP}/nox"
          else
            # Nothing reads the coverage files.
            .github/scripts/retry.sh nox -e "tests-${PYTHON_VERSION}(shard='trace')" -- \
              -m "trace_server" --no-cov -n "${TRACE_SERVER_COUNT}"
          fi
      - name: Dump service logs
        if: failure() && steps.filter_shards.outputs.skip != 'true'
        working-directory: ${{ env.CORE_DIR }}
        run: |
          for log in "${RUNNER_TEMP}"/trace-server/*.log; do
            echo "::group::${log##*/}"
            cat "${log}" || true
            echo "::endgroup::"
          done
          for service in wandb-local clickhouse; do
            echo "::group::${service} logs"
            docker compose logs --no-color "${service}" || true
            echo "::endgroup::"
          done

  slack-notification:
    name: Slack Notification
    needs:
      - nightly-tests

    runs-on: ubuntu-latest
    if: always()

    steps:
      - name: Determine Result and Failed Jobs
        id: result
        env:
          NEEDS: "${{ toJson(needs) }}"
        run: |
          jq -C . <<< "${NEEDS}" # debug

          # Check if any job failed
          has_failure=$(
            jq -r '
              .[]
              | select(.result == "failure")
              | "true"
            ' <<< "${NEEDS}" | head -n1
          )

          if [ "$has_failure" = "true" ]; then
            echo "status=failure" >> $GITHUB_OUTPUT
            
            failed_jobs=$(
              jq -r '
                to_entries
                | [
                  .[]
                  | select(.value.result == "failure")
                  | .key
                ]
                | join(", ")
              ' <<< "${NEEDS}"
            )
            echo "failed_jobs=$failed_jobs" >> $GITHUB_OUTPUT
          else
            echo "status=success" >> $GITHUB_OUTPUT
          fi

      - name: Send Slack Notification on Failure
        if: steps.result.outputs.status == 'failure'
        uses: slackapi/slack-github-action@fcfb566f8b0aab22203f066d80ca1d7e4b5d05b3 # v1.27.1
        with:
          channel-id: "C09CE03J867"
          slack-message: |
            <!subteam^S06HYJNN7SL> :x: Nightly Tests failed!
            *Repository:* ${{ github.repository }}
            *Commit:* ${{ github.sha }}
            *Failed Jobs:* ${{ steps.result.outputs.failed_jobs }}
            *Build:* ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        env:
          SLACK_BOT_TOKEN: ${{ secrets.WANDB_CI_SLACK_BOT_TOKEN }}

      - name: Send Slack Notification on Success
        if: steps.result.outputs.status == 'success'
        uses: slackapi/slack-github-action@fcfb566f8b0aab22203f066d80ca1d7e4b5d05b3 # v1.27.1
        with:
          channel-id: "C09CE03J867"
          slack-message: |
            :white_check_mark: Nightly Tests passed!
            *Repository:* ${{ github.repository }}
            *Commit:* ${{ github.sha }}
            *Build:* ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        env:
          SLACK_BOT_TOKEN: ${{ secrets.WANDB_CI_SLACK_BOT_TOKEN }}
