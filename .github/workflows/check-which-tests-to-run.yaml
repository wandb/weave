name: Check which tests to run

on:
  workflow_call:
    outputs:
      weave_js_tests:
        value: ${{ jobs.check.outputs.weave_js_tests }}
      trace_server_tests:
        value: ${{ jobs.check.outputs.trace_server_tests }}
      weave_ts_sdk_tests:
        value: ${{ jobs.check.outputs.weave_ts_sdk_tests }}

env:
  TRACE_SERVER_PATHS: "weave/trace_server/ weave/shared/ weave/trace/isolated_client_executor.py weave/evaluation/evaluate_model_worker.py weave/flow/llm_structured_model.py"
  WEAVE_TS_SDK_PATHS: "sdks/node/"
  # Everything else is implicitly trace SDK

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      trace_server_tests: ${{ steps.trace_server.outputs.run_tests }}
      weave_ts_sdk_tests: ${{ steps.weave_ts_sdk.outputs.run_tests }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 100
          fetch-tags: false
          ref: ${{ github.head_ref }}
      - name: Get changed files
        run: |
          set -euo pipefail

          # Determine the base branch and current commit
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            # For pull requests
            BASE_BRANCH="${{ github.base_ref }}"
            CURRENT_COMMIT="${{ github.event.pull_request.head.sha }}"
          else
            # For pushes
            BASE_BRANCH=$(git remote show origin | sed -n '/HEAD branch/s/.*: //p')
            CURRENT_COMMIT="${{ github.sha }}"
          fi
          echo "Base branch is $BASE_BRANCH"

          # Fetch only the base branch history needed for merge-base. If the
          # merge base is older than the bounded history, fail open below.
          git fetch --no-tags --depth=100 origin "$BASE_BRANCH:refs/remotes/origin/$BASE_BRANCH"

          # Find the common ancestor
          if MERGE_BASE=$(git merge-base "origin/$BASE_BRANCH" "$CURRENT_COMMIT"); then
            # Get changed files
            changed_files=$(git diff --name-only "$MERGE_BASE" "$CURRENT_COMMIT")
          else
            echo "::warning::Could not find merge base in shallow checkout; running gated tests"
            changed_files=$(printf "%s\n" $TRACE_SERVER_PATHS $WEAVE_TS_SDK_PATHS)
          fi

          echo "Changed files:"
          echo "$changed_files"
          echo "changed_files<<EOF" >> $GITHUB_ENV
          echo "$changed_files" >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV

      - id: trace_server
        name: Weave Trace Server Checks
        run: |
          for path in ${{ env.TRACE_SERVER_PATHS }}; do
            if echo "$changed_files" | grep -q "$path"; then
              echo "run_tests=true" >> $GITHUB_OUTPUT
              exit 0
            fi
          done
          echo "run_tests=false" >> $GITHUB_OUTPUT
      - id: weave_ts_sdk
        name: Weave TS SDK Checks
        run: |
          for path in ${{ env.WEAVE_TS_SDK_PATHS }}; do
            if echo "$changed_files" | grep -q "$path"; then
              echo "run_tests=true" >> $GITHUB_OUTPUT
              exit 0
            fi
          done
          echo "run_tests=false" >> $GITHUB_OUTPUT
