# We use self-hosted runners for performance: we can rely on docker caching
# on the runner machines for 0s startup times for our tests.
# There is an issue with self-hosted runners where if you use a mix of
# host and container jobs, the host jobs will fail to start
# (https://github.com/actions/checkout/issues/273).
# So we create a separate "builder" tagged runner to do the build job on
# the host, and then all the tests run on "runner" tagged runners.

name: test

on:
  push:

jobs:
  check-which-tests-to-run:
    uses: ./.github/workflows/check-which-tests-to-run.yaml

  weave-ts-sdk-lint:
    name: Weave TS SDK Lint
    runs-on: ubuntu-latest
    needs:
      - check-which-tests-to-run
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - name: Check if lint should run
        id: check_run
        run: |
          if [[ "${{ github.ref }}" == "refs/heads/master" || "${{ needs.check-which-tests-to-run.outputs.weave_ts_sdk_tests }}" == "true" ]]; then
            echo "Lint should run"
            echo "should_lint=true" >> $GITHUB_OUTPUT
          else
            echo "Lint should not run"
            echo "should_lint=false" >> $GITHUB_OUTPUT
          fi
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.8.1
      - name: Run Weave TS SDK Lint
        if: steps.check_run.outputs.should_lint == 'true'
        run: |
          cd sdks/node
          pnpm install --frozen-lockfile
          pnpm run prettier-check

  # ==== Trace Jobs ====
  lint:
    name: Python lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.10"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install nox uv
      - name: Run nox
        run: nox -e lint

  trace_no_server:
    name: Trace non-trace server tests
    timeout-minutes: 10
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version-major: ["3"]
        python-version-minor: [
            "10",
            "11",
            "13",
            #
          ]
        nox-shard: ["trace_no_server"]
      fail-fast: false
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Set up Python ${{ matrix.python-version-major }}.${{ matrix.python-version-minor }}
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version-major }}.${{ matrix.python-version-minor }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install nox uv
      - name: Run nox (Non Trace Server)
        run: |
          nox -e "tests-${{ matrix.python-version-major }}.${{ matrix.python-version-minor }}(shard='${{ matrix.nox-shard }}')" -- -m "not trace_server"

  trace-tests:
    name: Trace nox tests
    # Dependabot runs get no access to the GitHub App key this job needs.
    if: github.actor != 'dependabot[bot]'
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
      id-token: write
    runs-on: ubuntu-latest-8-cores
    strategy:
      matrix:
        python-version-major: ["3"]
        python-version-minor: [
            "10",
            "11",
            "13",
            #
          ]
        # Every job starts core's stack, so the shards other than the two
        # trace shards share one job per Python version and run side by side.
        group: ["trace", "trace_calls_merged_only", "integrations"]
        # Shards that don't support certain Python versions. The Claude Agent
        # SDK has both server-backed calls tests and no-server OTel tests, so
        # it runs once, on 3.10, without the marker filter.
        include:
          - python-version-minor: "10"
            group: "integrations"
            skip-shards: "notdiamond verifiers_test"
          - python-version-minor: "11"
            group: "integrations"
            skip-shards: "claude_agent_sdk"
          - python-version-minor: "13"
            group: "integrations"
            skip-shards: "claude_agent_sdk cohere notdiamond verifiers_test"
      fail-fast: false
    env:
      CORE_DIR: core
      COMPOSE_FILE: .github/compose/weave-trace-tests.yaml
      # One server per xdist worker or parallel shard.
      TRACE_SERVER_COUNT: 8
      # Longest first, so the parallel shards finish together.
      INTEGRATION_SHARDS: >-
        llamaindex langchain autogen_tests stainless trace_server_bindings flow
        scorers crewai openai dspy anthropic verifiers_test vertexai litellm
        openai_agents mistral instructor smolagents google_genai pandas_test
        claude_agent_sdk bedrock fastmcp cohere cerebras groq google_adk
        notdiamond
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Create GitHub App token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3
        with:
          app-id: ${{ vars.WANDBOT_3000_APP_ID }}
          private-key: ${{ secrets.WANDBOT_3000_PRIVATE_KEY }}
          owner: wandb
          repositories: core
          permission-contents: read
      - name: Checkout core
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: wandb/core
          ref: master
          path: ${{ env.CORE_DIR }}
          token: ${{ steps.app-token.outputs.token }}
          persist-credentials: false
      - name: Remove core Weave submodule placeholder
        run: rm -rf "${CORE_DIR}/services/weave-trace/weave-public"
      - name: Checkout current weave commit into core
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          path: ${{ env.CORE_DIR }}/services/weave-trace/weave-public
          persist-credentials: false
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ secrets.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.WORKLOAD_IDENTITY_SERVICE_ACCOUNT }}
      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3
      - name: Configure Docker auth
        run: gcloud auth configure-docker us-central1-docker.pkg.dev --quiet
      - name: Enable debug logging
        run: echo "ACTIONS_STEP_DEBUG=true" >> $GITHUB_ENV
      - name: Set up Python ${{ matrix.python-version-major }}.${{ matrix.python-version-minor }}
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version-major }}.${{ matrix.python-version-minor }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install nox uv
      - name: Start trace servers
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: .github/scripts/start-trace-server.sh
      - name: Run nox (HTTP trace server)
        env:
          WEAVE_SENTRY_ENV: ci
          CI: 1
          WEAVE_SERVER_DISABLE_ECOSYSTEM: 1
          # For the tests that create a second project (`ensure_project`).
          WANDB_BASE_URL: http://localhost:8080
          # Use format-valid dummy API keys when secrets aren't available
          # Tests use VCR recordings so real keys aren't needed
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY || 'DUMMY_API_KEY' }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY || 'DUMMY_API_KEY' }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY || 'DUMMY_API_KEY' }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY || 'DUMMY_API_KEY' }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY || 'sk-1234567890abcdef1234567890abcdef' }}
          DD_TRACE_ENABLED: false
          PYTHON_VERSION: ${{ matrix.python-version-major }}.${{ matrix.python-version-minor }}
          SKIP_SHARDS: ${{ matrix.skip-shards }}
        run: |
          if [[ "${{ matrix.group }}" == "integrations" ]]; then
            shards=()
            for shard in ${INTEGRATION_SHARDS}; do
              [[ " ${SKIP_SHARDS} " == *" ${shard} "* ]] || shards+=("${shard}")
            done
            python .github/scripts/run_nox_shards.py "${PYTHON_VERSION}" "${shards[@]}" \
              --unfiltered claude_agent_sdk --log-dir "${RUNNER_TEMP}/nox"
          else
            # Nothing reads the coverage files.
            nox -e "tests-${PYTHON_VERSION}(shard='${{ matrix.group }}')" -- \
              -m "trace_server" --no-cov -n "${TRACE_SERVER_COUNT}"
          fi
      - name: Dump service logs
        if: failure()
        working-directory: ${{ env.CORE_DIR }}
        run: |
          for log in "${RUNNER_TEMP}"/trace-server/*.log; do
            echo "::group::${log##*/}"
            cat "${log}" || true
            echo "::endgroup::"
          done
          for service in wandb-local clickhouse; do
            echo "::group::${service} logs"
            docker compose logs --no-color "${service}" || true
            echo "::endgroup::"
          done
  # The lock pins one exporter. google-adk still resolves 1.42.1, and a
  # later release can be newer than the lock. Run the conversation-tracing
  # tests at both ends.
  otel-http-exporter-bounds:
    name: OTLP HTTP exporter bounds
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install uv
          uv sync --frozen --group test
      - name: Conversation tracing on exporter 1.42.1
        env:
          DD_TRACE_ENABLED: "false"
        run: |
          uv pip install --python .venv/bin/python \
            "opentelemetry-exporter-otlp-proto-http==1.42.1"
          .venv/bin/python -c "import importlib.metadata as m; print('exporter', m.version('opentelemetry-exporter-otlp-proto-http'))"
          .venv/bin/python -m pytest tests/trace/test_conversation_tracing_setup.py \
            -p no:ddtrace --tb=short
      - name: Conversation tracing on the newest allowed exporter
        env:
          DD_TRACE_ENABLED: "false"
        run: |
          uv pip install --python .venv/bin/python \
            --upgrade-package opentelemetry-exporter-otlp-proto-http \
            --upgrade-package opentelemetry-exporter-otlp-proto-common \
            --upgrade-package opentelemetry-sdk \
            --upgrade-package opentelemetry-api \
            --upgrade-package opentelemetry-proto \
            --upgrade-package opentelemetry-semantic-conventions \
            "opentelemetry-exporter-otlp-proto-http>=1.28.0"
          .venv/bin/python -c "import importlib.metadata as m; print('exporter', m.version('opentelemetry-exporter-otlp-proto-http'))"
          .venv/bin/python -m pytest tests/trace/test_conversation_tracing_setup.py \
            -p no:ddtrace --tb=short

  trace-tests-matrix-check: # This job does nothing and is only used for the branch protection
    if: always()

    needs:
      - trace-tests
      - trace_no_server
      - otel-http-exporter-bounds

    runs-on: ubuntu-latest

    steps:
      - name: Passes if all trace-tests and trace_no_server jobs succeeded
        uses: re-actors/alls-green@b5b5b37504aa4183270bd3d855c52a67f212be35 # release/v1
        with:
          jobs: ${{ toJSON(needs) }}
          # trace-tests is skipped only on Dependabot runs (see its `if`).
          # This action treats skipped as failing by default.
          allowed-skips: trace-tests

  # ==== Windows Jobs ====
  windows_trace_no_server:
    name: Windows Trace non-trace server tests
    timeout-minutes: 15
    runs-on: windows-latest
    strategy:
      matrix:
        python-version-major: ["3"]
        python-version-minor: [
            "10",
            "11",
            "13",
            #
          ]
        nox-shard: ["trace_no_server"]
      fail-fast: false
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Set up Python ${{ matrix.python-version-major }}.${{ matrix.python-version-minor }}
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version-major }}.${{ matrix.python-version-minor }}
      - name: Set up uv (cached)
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: "0.11.19"
          enable-cache: true
          cache-local-path: ${{ runner.temp }}\uv-cache
          cache-dependency-glob: "**/pyproject.toml"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install nox
      - name: Run nox (Non Trace Server)
        env:
          DD_TRACE_ENABLED: "false"
        run: |
          nox -e "tests-${{ matrix.python-version-major }}.${{ matrix.python-version-minor }}(shard='${{ matrix.nox-shard }}')" -- -m "not trace_server"

  windows-trace-tests-matrix-check: # This job does nothing and is only used for the branch protection
    if: always()

    needs:
      - windows_trace_no_server

    runs-on: ubuntu-latest

    steps:
      - name: Passes if all windows_trace_no_server jobs succeeded
        uses: re-actors/alls-green@b5b5b37504aa4183270bd3d855c52a67f212be35 # release/v1
        with:
          jobs: ${{ toJSON(needs) }}
