[project]
name = "trace_server_mock"
version = "0.1.0"
description = "Lightweight in-memory mock of the Weave trace server, for SDK integration tests."
requires-python = ">=3.10"
readme = "README.md"
license = { text = "Apache-2.0" }
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn>=0.30.0",
  "pydantic>=2.7.1,<3",
  # Pulls in the generated client's request types from
  # `weave.vendor.weave_server_sdk` (generated from the trace server's OpenAPI
  # spec) so the mock validates incoming requests against the shape the
  # production API declares. When the API renames or restructures a request,
  # Pydantic validation fails immediately. That drift signal is the central
  # reason for this dependency.
  "weave",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/trace_server_mock"]

[tool.uv.sources]
# Resolve `weave` through the uv workspace declared in the parent
# `pyproject.toml` rather than from PyPI. This guarantees the mock always
# binds to the SAME generated client the rest of the repo is using — drift
# detection only works if the mock and the SDK come from the same source tree.
weave = { workspace = true }

[project.scripts]
trace_server_mock = "trace_server_mock.__main__:main"
